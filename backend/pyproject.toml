[project]
name = "plisto-backend"
version = "0.1.0"
description = "Plisto FastAPI backend"
authors = [
    {name = "Sagar Srivastav"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi (>=0.138.2,<0.139.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "langchain-anthropic (>=1.4.8,<2.0.0)",
    "langchain-openrouter (>=0.0.1,<1.0.0)",
    "langgraph (>=1.2.6,<2.0.0)",
    "langchain-core (>=1.4.8,<2.0.0)",
    "supabase (>=2.31.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[tool.poetry]
package-mode = false

[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
